name: Deploy

# Deploys three stacks in order: terraform/menu_sync (owns the ops topic),
# terraform/fresha_watch, then terraform/ (the two Meta bots). Plans on every
# push to main; applies when the "prod" environment holds the secrets each
# stack needs. After the bot stack applies, the workflow registers each
# bot's webhook with its Meta app. The parked monitor is not deployed.
#
# Hands-off menu changes: the menu sync Lambda opens a pull request from
# branch "menu-sync". This workflow runs the tests on that PR and, when they
# pass, merges it with the PAT. The merge is a push to main by the PAT, which
# triggers this workflow again to deploy. (A merge made with GITHUB_TOKEN
# would not trigger anything, hence the PAT.)
#
# Assumes the account's existing github-oidc role (trusts every Danny-Cooke
# repo). GitHub environment "prod":
#   variables: AWS_ROLE_ARN (that role's ARN)
#              OPS_ALERT_EMAILS (JSON list, optional), OWNER_EMAIL (optional)
#              MESSAGE_TEST_MODE (true: bots answer only messages that start
#                with the trigger word, i.e. only the tester; false: everyone)
#              BOT_MODE (simple | shadow | live; default simple)
#              ESCALATION_EMAILS (JSON list, Jess; optional until shadow)
#   secrets:   GH_PAT (fine-grained PAT: contents + pull requests on this repo)
#              ALERT_PHONE_NUMBERS (JSON list of E.164 numbers, optional)
#              TLG_APP1_ID, TLG_APP1_SECRET (Meta app for Messenger)
#              TLG_APP2_ID, TLG_APP2_SECRET (Meta app for Instagram, optional)
#              TLG_PAGE_TOKEN (Page access token; needed before bots can reply)
#              ANTHROPIC_AWS_WORKSPACE_ID (optional until shadow)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-prod' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/requirements.txt -r requirements-dev.txt -r requirements-mcp.txt
      - run: python -m pytest -q

  # Only the Lambda's own branch is merged automatically. Any other PR still
  # waits for a person.
  merge-menu-sync:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'menu-sync' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Merge the menu sync pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The prod environment has no GH_PAT secret, so the menu sync PR cannot be merged automatically."
            exit 1
          fi
          gh pr merge "$PR" --squash --delete-branch

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_environment: prod
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_ops_alert_emails: ${{ vars.OPS_ALERT_EMAILS || '[]' }}
      TF_VAR_owner_email: ${{ vars.OWNER_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: The deploy role must exist and be named in the prod environment
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_ROLE_ARN is not set on the prod environment: gh variable set AWS_ROLE_ARN --env prod --body arn:aws:iam::<account>:role/github-oidc"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the Lambda bundles
        run: |
          pip install --quiet -r requirements-mcp.txt  # python-hcl2 for the salon config render
          bash scripts/build_lambda.sh menu_sync
          bash scripts/build_lambda.sh fresha_watch menu_sync
          bash scripts/build_lambda.sh bot menu_sync

      # The secrets context is not available in a step's `if`, so a step
      # decides and the applies read its output.
      - name: Decide which stacks can be applied
        id: gate
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TLG_APP1_SECRET: ${{ secrets.TLG_APP1_SECRET }}
          TLG_APP2_SECRET: ${{ secrets.TLG_APP2_SECRET }}
          TLG_PAGE_TOKEN: ${{ secrets.TLG_PAGE_TOKEN }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan only. The prod environment has no GH_PAT secret yet."
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$GH_PAT" ] && [ -n "$TLG_APP1_SECRET" ]; then
            echo "apply_bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply_bot=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bot stack: plan only. Needs TLG_APP1_SECRET on the prod environment."
          fi
          [ -n "$TLG_APP2_SECRET" ] && echo "instagram=true" >> "$GITHUB_OUTPUT" || echo "instagram=false" >> "$GITHUB_OUTPUT"
          [ -n "$TLG_PAGE_TOKEN" ] || echo "::notice::No TLG_PAGE_TOKEN yet: the bots will store and email messages but cannot reply, and the Page must be subscribed to each app in the Meta console."

      # ---- menu sync ------------------------------------------------------

      - name: Menu sync - init
        working-directory: terraform/menu_sync
        run: terraform init

      - name: Menu sync - plan
        working-directory: terraform/menu_sync
        env:
          # A placeholder keeps the plan readable before the secret is set.
          TF_VAR_github_pat: ${{ secrets.GH_PAT || 'unset' }}
        run: terraform plan -no-color -var-file=../salon.auto.tfvars -out=tfplan

      - name: Menu sync - apply
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/menu_sync
        run: terraform apply -no-color -auto-approve tfplan

      # ---- Fresha watch (reads the ops topic from the menu sync state) -----

      - name: Fresha watch - init
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/fresha_watch
        run: terraform init

      - name: Fresha watch - plan
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/fresha_watch
        env:
          TF_VAR_alert_phone_numbers: ${{ secrets.ALERT_PHONE_NUMBERS || '[]' }}
        run: terraform plan -no-color -var-file=../salon.auto.tfvars -out=tfplan

      - name: Fresha watch - apply
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/fresha_watch
        run: terraform apply -no-color -auto-approve tfplan

      # ---- Meta bots (reads the ops topic from the menu sync state) -------

      - name: Bots - init
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform
        run: terraform init

      - name: Bots - plan
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform
        env:
          TF_VAR_bot_mode: ${{ vars.BOT_MODE || 'simple' }}
          TF_VAR_message_test_mode: ${{ vars.MESSAGE_TEST_MODE || 'true' }}
          TF_VAR_escalation_emails: ${{ vars.ESCALATION_EMAILS || '[]' }}
          TF_VAR_meta_messenger_app_id: ${{ secrets.TLG_APP1_ID || '0' }}
          TF_VAR_meta_messenger_app_secret: ${{ secrets.TLG_APP1_SECRET || 'unset' }}
          TF_VAR_meta_instagram_app_id: ${{ secrets.TLG_APP2_ID || '' }}
          TF_VAR_meta_instagram_app_secret: ${{ secrets.TLG_APP2_SECRET || '' }}
          TF_VAR_meta_page_token: ${{ secrets.TLG_PAGE_TOKEN || '' }}
          TF_VAR_anthropic_aws_workspace_id: ${{ secrets.ANTHROPIC_AWS_WORKSPACE_ID || '' }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          TF_VAR_telegram_chat_id: ${{ vars.TELEGRAM_CHAT_ID || '' }}
        run: terraform plan -no-color -out=tfplan

      - name: Bots - apply
        if: steps.gate.outputs.apply_bot == 'true'
        working-directory: terraform
        run: terraform apply -no-color -auto-approve tfplan

      # Meta calls GET on each URL during registration, so this runs after
      # the apply. Idempotent: every deploy re-asserts the subscription.
      - name: Bots - register the Messenger webhook with Meta
        if: steps.gate.outputs.apply_bot == 'true'
        working-directory: terraform
        env:
          APP_ID: ${{ secrets.TLG_APP1_ID }}
          APP_SECRET: ${{ secrets.TLG_APP1_SECRET }}
          PAGE_ID: ${{ secrets.TLG_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.TLG_PAGE_TOKEN }}
        run: |
          pip install --quiet requests
          PAGE_ID="${PAGE_ID:-$(terraform output -raw meta_page_id)}"
          python ../scripts/meta_setup.py --channel messenger \
            --app-id "$APP_ID" --app-secret "$APP_SECRET" \
            --callback-url "$(terraform output -json webhook_urls | python -c 'import sys,json; print(json.load(sys.stdin)["messenger"])')" \
            --verify-token "$(terraform output -json webhook_verify_tokens | python -c 'import sys,json; print(json.load(sys.stdin)["messenger"])')" \
            ${PAGE_TOKEN:+--page-id "$PAGE_ID" --page-token "$PAGE_TOKEN"}

      - name: Bots - register the Instagram webhook with Meta
        if: steps.gate.outputs.apply_bot == 'true' && steps.gate.outputs.instagram == 'true'
        working-directory: terraform
        env:
          APP_ID: ${{ secrets.TLG_APP2_ID }}
          APP_SECRET: ${{ secrets.TLG_APP2_SECRET }}
          PAGE_ID: ${{ secrets.TLG_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.TLG_PAGE_TOKEN }}
        run: |
          pip install --quiet requests
          PAGE_ID="${PAGE_ID:-$(terraform output -raw meta_page_id)}"
          python ../scripts/meta_setup.py --channel instagram \
            --app-id "$APP_ID" --app-secret "$APP_SECRET" \
            --callback-url "$(terraform output -json webhook_urls | python -c 'import sys,json; print(json.load(sys.stdin)["instagram"])')" \
            --verify-token "$(terraform output -json webhook_verify_tokens | python -c 'import sys,json; print(json.load(sys.stdin)["instagram"])')" \
            ${PAGE_TOKEN:+--page-id "$PAGE_ID" --page-token "$PAGE_TOKEN"}

      - name: Bots - webhook URLs
        if: steps.gate.outputs.apply_bot == 'true'
        working-directory: terraform
        run: terraform output -json webhook_urls
