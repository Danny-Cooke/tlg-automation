name: Deploy

# Deploys the menu sync stack (terraform/menu_sync) and the Fresha watch
# stack (terraform/fresha_watch), in that order: the watch reads the ops
# topic from the menu sync state. Plans on every push to main; applies when
# the "prod" environment holds the PAT. The bot stack (terraform/) is not
# deployed by this workflow yet.
#
# Hands-off menu changes: the Lambda opens a pull request from branch
# "menu-sync". This workflow runs the tests on that PR and, when they pass,
# merges it with the PAT. The merge is a push to main by the PAT, which
# triggers this workflow again to deploy. (A merge made with GITHUB_TOKEN
# would not trigger anything, hence the PAT.)
#
# Assumes the account's existing github-oidc role (trusts every Danny-Cooke
# repo), the same one the other repos deploy with. GitHub environment "prod":
#   variables: AWS_ROLE_ARN (that role's ARN),
#              OPS_ALERT_EMAILS (JSON list, optional), OWNER_EMAIL (optional)
#   secrets:   GH_PAT (fine-grained PAT: contents + pull requests on this repo)
#              ALERT_PHONE_NUMBERS (JSON list of E.164 numbers, optional)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-prod' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r src/requirements.txt -r requirements-dev.txt -r requirements-mcp.txt
      - run: python -m pytest -q

  # Only the Lambda's own branch is merged automatically. Any other PR still
  # waits for a person.
  merge-menu-sync:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'menu-sync' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Merge the menu sync pull request
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The prod environment has no GH_PAT secret, so the menu sync PR cannot be merged automatically."
            exit 1
          fi
          gh pr merge "$PR" --squash --delete-branch

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    env:
      AWS_REGION: eu-west-2
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      TF_VAR_environment: prod
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_ops_alert_emails: ${{ vars.OPS_ALERT_EMAILS || '[]' }}
      TF_VAR_owner_email: ${{ vars.OWNER_EMAIL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: The deploy role must exist and be named in the prod environment
        env:
          ROLE: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_ROLE_ARN is not set on the prod environment: gh variable set AWS_ROLE_ARN --env prod --body arn:aws:iam::<account>:role/github-oidc"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build the Lambda bundles
        run: |
          bash scripts/build_lambda.sh menu_sync
          bash scripts/build_lambda.sh fresha_watch menu_sync

      # The secrets context is not available in a step's `if`, so a step
      # decides and the applies read its output.
      - name: Decide whether the stacks can be applied
        id: gate
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Plan only. The prod environment has no GH_PAT secret yet."
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- menu sync ------------------------------------------------------

      - name: Menu sync - init
        working-directory: terraform/menu_sync
        run: terraform init

      - name: Menu sync - plan
        working-directory: terraform/menu_sync
        env:
          # A placeholder keeps the plan readable before the secret is set.
          TF_VAR_github_pat: ${{ secrets.GH_PAT || 'unset' }}
        run: terraform plan -no-color -var-file=../salon.auto.tfvars -out=tfplan

      - name: Menu sync - apply
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/menu_sync
        run: terraform apply -no-color -auto-approve tfplan

      # ---- Fresha watch (reads the ops topic from the menu sync state) -----

      - name: Fresha watch - init
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/fresha_watch
        run: terraform init

      - name: Fresha watch - plan
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/fresha_watch
        env:
          TF_VAR_alert_phone_numbers: ${{ secrets.ALERT_PHONE_NUMBERS || '[]' }}
        run: terraform plan -no-color -var-file=../salon.auto.tfvars -out=tfplan

      - name: Fresha watch - apply
        if: steps.gate.outputs.apply == 'true'
        working-directory: terraform/fresha_watch
        run: terraform apply -no-color -auto-approve tfplan
